services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: sapa
      POSTGRES_USER: sapa
      POSTGRES_PASSWORD: sapa
    ports:
      - "5432:5432"
    volumes:
      - sapa-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sapa -d sapa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sapa-postgres:
